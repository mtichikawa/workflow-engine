[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engine"
version = "0.0.1"
description = "A general workflow-automation engine: modular AI specialists composed into recipes on a board."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }   # code only — data licenses: DATA-NOTICE.md
dependencies = [
    # added as phases need them (e.g. anthropic, requests). The brain call is a
    # swappable port: dev = Claude CLI (free on Max), product = Claude API (billed).
]

[project.optional-dependencies]
# MCP interop lives at the edges (engine/mcp/ + the mcp_call specialist) and is OPTIONAL. Core install
# and every non-MCP workflow run without it. From a clone:  pip install -e '.[mcp]'
mcp = ["mcp>=1.0"]
# The live demo view (engine/live/) reads PDFs: a text layer directly, a scanned fax as page images.
live = ["pypdf[image]>=4"]

[tool.setuptools.packages.find]
include = ["engine*"]
